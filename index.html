<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fics">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" type="image/png" href="icon-512.png?v=2">
<title>Fics</title>
<style>
  /* Temas: claro (papel), sepia y oscuro. El tema se guarda por dispositivo. */
  :root, [data-theme="claro"] {
    --bg: #f4efe6; --card: #fffdf8; --ink: #2a2420; --muted: #85776a; --line: #e4dacb;
    --accent: #e8662a; --accent-ink: #fff; --chip: #f3e6d8; --shadow: rgba(60, 40, 20, .12);
  }
  [data-theme="sepia"] {
    --bg: #ece0c8; --card: #f5ead4; --ink: #3b2e22; --muted: #85715b; --line: #d9c7a6;
    --accent: #b5532a; --accent-ink: #fff; --chip: #e4d3b2; --shadow: rgba(60, 40, 20, .15);
  }
  [data-theme="oscuro"] {
    --bg: #161412; --card: #211e1b; --ink: #e9e0d4; --muted: #9c8f80; --line: #34302b;
    --accent: #f08550; --accent-ink: #1a1512; --chip: #2d2925; --shadow: rgba(0, 0, 0, .4);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body { font: 16px/1.5 -apple-system, "Helvetica Neue", Helvetica, sans-serif; -webkit-text-size-adjust: 100%; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; -webkit-appearance: none; cursor: pointer; }
  .hidden { display: none !important; }

  /* Barra superior */
  .bar {
    position: -webkit-sticky; position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; height: 48px; padding: 0 8px;
    padding-top: env(safe-area-inset-top); height: calc(48px + env(safe-area-inset-top));
    background: var(--card); border-bottom: 1px solid var(--line);
  }
  .bar .back { min-width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--accent); }
  .bar .title { flex: 1; text-align: center; font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
  .bar .brand { color: var(--accent); font: italic 700 22px Georgia, serif; letter-spacing: .5px; }
  .bar .tool { min-width: 40px; height: 40px; border: 0; background: transparent; color: var(--accent); font-weight: 700; font-size: 15px; }

  main { max-width: 640px; margin: 0 auto; padding: 16px 16px 48px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin: 0 0 14px; }
  .muted { color: var(--muted); }
  .msg { font-size: 14px; margin-top: 10px; }
  .ok { color: #3f8a4f; } .bad { color: #c0392b; }

  /* Formularios */
  label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  input[type=password] {
    width: 100%; font-size: 16px; padding: 11px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--ink); -webkit-appearance: none;
  }
  .check { display: flex; align-items: center; margin-top: 12px; font-size: 14px; color: var(--ink); }
  .check input { width: 20px; height: 20px; margin: 0 8px 0 0; }
  .btn { display: block; width: 100%; margin-top: 14px; padding: 12px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; text-align: center; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .btn[disabled] { opacity: .5; }

  /* Portadas */
  .cover {
    position: relative; width: 100%; padding-top: 156.25%; /* 512 x 800 */
    border-radius: 4px; overflow: hidden; background: #3a2a2e;
    box-shadow: 0 2px 6px var(--shadow), inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .cover img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  .cover .ph {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center;
    padding: 12%; text-align: center; color: #f7ecdf;
    background: linear-gradient(160deg, #4b2f3a 0%, #23171c 70%, #120c0f 100%);
  }
  .cover .ph b { font: italic 700 1.15em/1.15 Georgia, serif; }
  .cover .ph small { margin-top: .6em; font-size: .65em; letter-spacing: 1.5px; text-transform: uppercase; opacity: .7; }
  .cover .ph::after { content: ""; position: absolute; left: 10%; right: 10%; top: 8%; bottom: 8%; border: 1px solid rgba(247,236,223,.25); }

  /* Biblioteca */
  .shelf-head { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 0 12px; }
  .shelf-head h2 { margin: 0; font: 700 18px Georgia, serif; }
  .grid { display: flex; flex-wrap: wrap; margin: 0 -7px; }
  .book { width: 33.333%; padding: 0 7px 18px; }
  .book .cover { font-size: 15px; }
  .book .name { margin-top: 7px; font-weight: 600; font-size: 13px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .book .sub { font-size: 12px; color: var(--muted); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 4px; vertical-align: 1px; }
  .empty { text-align: center; padding: 32px 8px; }
  .sync { margin-top: 6px; text-align: center; font-size: 13px; color: var(--muted); min-height: 20px; }
  .sync.ready { color: #3f8a4f; }
  .sync.partial, .sync.offline { color: var(--accent); }

  /* Página del fic */
  .hero { display: flex; align-items: flex-start; }
  .hero .cover-wrap { width: 38%; flex: none; margin-right: 14px; }
  .hero .cover { font-size: 17px; }
  .hero h1 { margin: 2px 0 4px; font: 700 21px/1.2 Georgia, serif; }
  .hero .fandom { color: var(--accent); font-weight: 600; font-size: 14px; }
  .stats { font-size: 13px; color: var(--muted); margin: 8px 0; }
  .chips { margin-top: 6px; }
  .chip { display: inline-block; background: var(--chip); color: var(--ink); border-radius: 12px; padding: 2px 9px; margin: 0 4px 5px 0; font-size: 12px; }
  .summary { margin: 14px 0 0; font-family: Georgia, serif; }
  .mood { margin: 16px 0 4px; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 6px var(--shadow); }
  .mood img { display: block; width: 100%; height: auto; }
  .toc { list-style: none; margin: 16px 0 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .toc li + li { border-top: 1px solid var(--line); }
  .toc a { display: flex; align-items: center; min-height: 52px; padding: 10px 14px; }
  .toc .num { width: 28px; flex: none; margin-right: 10px; color: var(--muted); font-size: 13px; text-align: right; }
  .toc .t { flex: 1; }
  .toc .t small { display: block; color: var(--muted); font-size: 12px; }
  .toc .flag { flex: none; margin-left: 8px; font-size: 11px; font-weight: 700; color: var(--accent-ink); background: var(--accent); border-radius: 9px; padding: 1px 7px; }
  .toc .read .t { color: var(--muted); }
  .toc .go { color: var(--muted); font-size: 20px; margin-left: 8px; }

  /* Lector */
  .reader { font-family: Georgia, "Hiragino Mincho ProN", serif; line-height: 1.75; padding-top: 22px; }
  .reader .chap-kicker { text-align: center; color: var(--accent); font: 600 12px -apple-system, Helvetica, sans-serif; letter-spacing: 2px; text-transform: uppercase; }
  .reader h2 { text-align: center; font-size: 1.35em; line-height: 1.25; margin: 6px 0 26px; }
  .reader p { margin: 0 0 1em; text-align: left; }
  .reader hr { border: 0; text-align: center; margin: 1.6em 0; }
  .reader hr::before { content: "✦   ✦   ✦"; white-space: pre; color: var(--muted); font-size: .8em; }
  .reader h3, .reader h4 { font-size: 1.05em; margin: 1.4em 0 .6em; }
  .pager { display: flex; margin-top: 28px; }
  .pager .btn + .btn { margin-left: 10px; }
  .pager .btn { margin: 0; }
  .end { text-align: center; color: var(--muted); font-size: 13px; margin-top: 18px; }
  .progress { position: fixed; left: 0; bottom: 0; height: 3px; background: var(--accent); width: 0; z-index: 6; }

  /* Comentarios y edición */
  .bar .tools { display: flex; align-items: center; }
  .bar a.tool { display: flex; align-items: center; justify-content: center; }
  textarea {
    width: 100%; min-height: 96px; font: 16px/1.5 -apple-system, Helvetica, sans-serif; padding: 10px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); -webkit-appearance: none;
  }
  .comments { margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--line); }
  .comments h3 { margin: 0 0 12px; font: 700 18px Georgia, serif; }
  .comments h3 .muted { font: 400 14px -apple-system, Helvetica, sans-serif; }
  .comments p { margin: 0 0 12px; font-size: 14px; }
  .cms { list-style: none; margin: 0 0 14px; padding: 0; }
  .cm { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; margin-bottom: 8px; }
  .cm.claude { border-left: 3px solid var(--accent); }
  .cm .who { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .cm .pend { color: var(--accent); font-weight: 600; }
  .cm .txt { font-size: 15px; line-height: 1.45; }
  .banner { background: var(--chip); border-radius: 8px; padding: 8px 12px; margin: 0 0 16px; font: 13px/1.4 -apple-system, Helvetica, sans-serif; }
  .editor .hint { font-size: 13px; margin: 0 0 10px; }
  .editor label { margin-top: 0; }
  input.field { width: 100%; font: 600 17px Georgia, serif; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); -webkit-appearance: none; }
  .edtools { margin: 10px 0 8px; }
  .chipbtn { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 16px; padding: 6px 14px; margin-right: 8px; font-size: 14px; }
  .banner a { color: var(--accent); font-weight: 600; }
  .editor textarea { min-height: 72vh; font: 16px/1.65 Georgia, serif; }
  h2.h { margin: 0 0 6px; font: 700 18px Georgia, serif; }

  .toast { position: fixed; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 20; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 12px 14px; font-size: 14px; box-shadow: 0 4px 16px var(--shadow); }

  /* Panel de ajustes de lectura */
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card); border-top: 1px solid var(--line); padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 16px var(--shadow); }
  .sheet .row { display: flex; align-items: center; margin-bottom: 12px; }
  .sheet .row:last-child { margin-bottom: 0; }
  .sheet .lbl { width: 64px; margin-right: 8px; font-size: 13px; color: var(--muted); }
  .seg { flex: 1; display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { flex: 1; height: 40px; border: 0; background: transparent; color: var(--ink); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
</style>
</head>
<body>
<div id="app"><main><div class="card muted">Cargando…</div></main></div>
<script src="app.js?v=7"></script>
</body>
</html>
